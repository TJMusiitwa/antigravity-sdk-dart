name: Run Examples on Tag

on:
  # push:
  #   tags:
  #     - '*'
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System to run on'
        required: true
        default: 'ubuntu'
        type: choice
        options:
          - 'ubuntu'
          - 'macos'
          - 'both'

jobs:
  configure-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          choice="${{ inputs.os || 'ubuntu' }}"
          case "$choice" in
            macos)
              echo 'matrix=["macos-latest"]' >> $GITHUB_OUTPUT
              ;;
            both)
              echo 'matrix=["ubuntu-latest", "macos-latest"]' >> $GITHUB_OUTPUT
              ;;
            *)
              echo 'matrix=["ubuntu-latest"]' >> $GITHUB_OUTPUT
              ;;
          esac

  run-examples:
    needs: configure-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.configure-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Getting Started examples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for f in example/getting_started/*.dart; do
            # Skip interactive, environment-dependent, or unsupported examples
            # Note: compaction.dart is skipped until upstream localharness binary on PyPI supports compaction_config
            if [[ "$f" == *"human_in_the_loop.dart"* ]] || \
               [[ "$f" == *"autonomous_shell.dart"* ]] || \
               [[ "$f" == *"mcp_tools.dart"* ]] || \
               [[ "$f" == *"compaction.dart"* ]]; then
              echo "Skipping: $f"
              continue
            fi
            echo "Running $f"
            dart run "$f" || exit 1
          done

      - name: Run Deep Dive examples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for f in example/deep_dives/*.dart; do
            # Skip interactive or complex agent examples
            if [[ "$f" == *"interactive_cli.dart"* ]] || \
               [[ "$f" == *"doc_maintenance_agent.dart"* ]] || \
               [[ "$f" == *"docstring_maintenance_agent.dart"* ]]; then
              echo "Skipping: $f"
              continue
            fi
            echo "Running $f"
            dart run "$f" || exit 1
          done
